<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDAA Cinema</title><style>body{margin:0;background:#101827;color:#fff;font:20px Arial,sans-serif}main{max-width:850px;margin:auto;padding:22px}h1{font-size:32px}button,a.btn{display:block;box-sizing:border-box;width:100%;padding:20px;margin:13px 0;background:#2164bb;color:white;border:2px solid #6e9fe0;border-radius:12px;font-size:23px;text-align:center;text-decoration:none;cursor:pointer}button:focus,a:focus{outline:4px solid #ffca45}#status{background:#1d293d;padding:20px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}video{width:100%;max-height:420px;background:black}small{color:#b7c7d8}</style></head><body><main><h1>VIDAA CINEMA</h1><p>Все проверки в одном месте. Управление пультом.</p><a class="btn" href="https://okko.tv/">1. Открыть Okko</a><button onclick="testDRM()">2. Проверить DRM</button><button onclick="testHLS()">3. Проверить HLS-видео</button><button onclick="stopVideo()">Остановить видео</button><video id="v" controls playsinline style="display:none"></video><div id="status">Нажмите кнопку проверки.</div><p><small>Проверка DRM показывает поддержку API, но не гарантирует воспроизведение фильмов Okko.</small></p></main><script>
var v=document.getElementById('v'), statusEl=document.getElementById('status');function out(s){statusEl.textContent=s}function stopVideo(){try{v.pause();v.removeAttribute('src');v.load()}catch(e){}v.style.display='none'}
function testHLS(){stopVideo();v.style.display='block';v.src='https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';out('Проверка HLS: нажмите Play на видео. Если не играет, это может быть ограничение встроенного браузера.');v.play().catch(function(e){out('HLS: '+e.message+'\nПопробуйте нажать Play вручную.')});v.onerror=function(){out('HLS: ошибка воспроизведения (код '+(v.error?v.error.code:'?')+').')}}
function testDRM(){stopVideo();out('Проверяем DRM...');if(!navigator.requestMediaKeySystemAccess){out('EME API: НЕТ\nБраузер не предоставляет requestMediaKeySystemAccess.\nЭто не является полной проверкой возможностей нативных приложений VIDAA.');return}var systems=[['Widevine','com.widevine.alpha'],['PlayReady','com.microsoft.playready'],['ClearKey','org.w3.clearkey']];var configs=[{initDataTypes:['cenc'],videoCapabilities:[{contentType:'video/mp4; codecs="avc1.42E01E"'}]}];var i=0,res='EME API: ДА\n';function next(){if(i>=systems.length){out(res+'\nТест проверяет только доступность ключевых систем, не выдачу лицензии Okko.');return}var s=systems[i++];try{navigator.requestMediaKeySystemAccess(s[1],configs).then(function(){res+=s[0]+': ДОСТУПЕН\n';next()},function(e){res+=s[0]+': НЕТ ('+(e.name||'ошибка')+')\n';next()})}catch(e){res+=s[0]+': ОШИБКА ('+e.message+')\n';next()}}next()}
</script></body></html>
