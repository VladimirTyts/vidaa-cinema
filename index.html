<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VIDAA Cinema</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:5vh 5vw}h1{font-size:clamp(30px,5vw,60px);margin:0 0 12px}.sub{color:#b9c4d7;font-size:clamp(17px,2vw,25px);margin-bottom:7vh}.buttons{display:grid;gap:22px;max-width:1000px}a,button{font:inherit;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#fff;border:3px solid #34445d;background:#1a2b43;border-radius:18px;padding:30px 20px;font-size:clamp(23px,3.3vw,42px);min-height:110px;cursor:pointer}a.primary{background:#1468b6;border-color:#3c95df}a:focus,button:focus{outline:6px solid #ffcf53;outline-offset:5px}small{display:block;color:#b9c4d7;margin-top:32px;font-size:17px;line-height:1.5}
</style>
</head>
<body>
<h1>VIDAA CINEMA</h1>
<div class="sub">Быстрый запуск с пульта Hisense</div>
<div class="buttons">
<a id="rezka" class="primary" href="https://hdrezka-home.tv/">▶ Открыть HDRezka</a>
<a id="test" href="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">Тест HLS (ссылка на поток)</a>
</div>
<small>HDRezka открывается как внешний сайт в браузере VIDAA. Эта страница не является установленным нативным приложением и не переносит видео в собственный плеер.</small>
<script>
(function(){var links=document.querySelectorAll('a');function focus(i){links[(i+links.length)%links.length].focus()}document.addEventListener('keydown',function(e){var i=Array.prototype.indexOf.call(links,document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();focus(i+1)}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();focus(i-1)}else if(e.key==='Enter'&&i>=0){links[i].click()}});focus(0)})();
</script>
</body></html>
